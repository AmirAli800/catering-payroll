name: Build Windows executable

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing GitHub release to attach the executable to"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build standalone executable
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name CateringPayroll app.py
          if (!(Test-Path "dist/CateringPayroll.exe")) {
            throw "PyInstaller did not create dist/CateringPayroll.exe"
          }

      - name: Upload executable to release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: gh release upload "$env:RELEASE_TAG" "dist/CateringPayroll.exe" --repo "${{ github.repository }}" --clobber

      - name: Upload executable as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: CateringPayroll-Windows
          path: dist/CateringPayroll.exe
          if-no-files-found: error
